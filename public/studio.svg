<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000" role="img" aria-label="Illustration of a music studio setup">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12121a"/>
      <stop offset="100%" stop-color="#08080b"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a3e635" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#a3e635" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2b2b34"/>
      <stop offset="100%" stop-color="#17171d"/>
    </linearGradient>
  </defs>

  <rect width="800" height="1000" fill="url(#bg)"/>
  <circle cx="400" cy="250" r="330" fill="url(#glow)" opacity="0.35"/>
  <g opacity="0.14" stroke="#a3e635" stroke-width="1.4" fill="none">
    <path d="M40 700 L180 640 L310 700 L450 620 L590 690 L760 610"/>
    <path d="M40 760 L200 700 L340 760 L500 690 L640 750 L760 700"/>
  </g>

  <!-- keyboards / desk -->
  <g>
    <rect x="90" y="440" width="620" height="26" rx="6" fill="url(#metal)" stroke="#33333c"/>
    <rect x="90" y="466" width="620" height="150" rx="10" fill="#0e0e13" stroke="#2c2c34"/>
    <g fill="#1c1c24" stroke="#33333c">
      <rect x="112" y="488" width="34" height="34" rx="7"/>
      <rect x="156" y="488" width="34" height="34" rx="7"/>
      <rect x="200" y="488" width="34" height="34" rx="7"/>
      <rect x="244" y="488" width="34" height="34" rx="7"/>
      <rect x="288" y="488" width="34" height="34" rx="7"/>
      <rect x="332" y="488" width="34" height="34" rx="7"/>
      <rect x="376" y="488" width="34" height="34" rx="7"/>
      <rect x="420" y="488" width="34" height="34" rx="7"/>
      <rect x="464" y="488" width="34" height="34" rx="7"/>
      <rect x="508" y="488" width="34" height="34" rx="7"/>
      <rect x="552" y="488" width="34" height="34" rx="7"/>
      <rect x="596" y="488" width="34" height="34" rx="7"/>
      <rect x="640" y="488" width="48" height="34" rx="7"/>
    </g>
    <circle cx="150" cy="560" r="17" fill="#a3e635" opacity="0.85"/>
    <circle cx="200" cy="560" r="17" fill="#1c1c24" stroke="#33333c"/>
    <circle cx="250" cy="560" r="17" fill="#1c1c24" stroke="#33333c"/>
    <rect x="300" y="546" width="120" height="10" rx="5" fill="#1c1c24" stroke="#33333c"/>
    <rect x="300" y="566" width="200" height="10" rx="5" fill="#1c1c24" stroke="#33333c"/>
    <g fill="#a3e635" opacity="0.7">
      <rect x="560" y="548" width="6" height="26" rx="3"/>
      <rect x="576" y="536" width="6" height="38" rx="3"/>
      <rect x="592" y="556" width="6" height="18" rx="3"/>
      <rect x="608" y="530" width="6" height="44" rx="3"/>
      <rect x="624" y="550" width="6" height="24" rx="3"/>
      <rect x="640" y="540" width="6" height="34" rx="3"/>
    </g>
  </g>

  <!-- monitor speakers -->
  <g fill="#101015" stroke="#2c2c34">
    <rect x="120" y="300" width="150" height="150" rx="16"/>
    <rect x="530" y="300" width="150" height="150" rx="16"/>
  </g>
  <g fill="#1c1c24">
    <circle cx="195" cy="355" r="34"/>
    <circle cx="195" cy="410" r="20"/>
    <circle cx="605" cy="355" r="34"/>
    <circle cx="605" cy="410" r="20"/>
  </g>
  <g fill="#a3e635" opacity="0.55">
    <circle cx="195" cy="355" r="10"/>
    <circle cx="605" cy="355" r="10"/>
  </g>

  <!-- midi keyboard -->
  <g>
    <rect x="200" y="660" width="400" height="90" rx="12" fill="url(#metal)" stroke="#33333c"/>
    <g fill="#eceff4">
      <rect x="216" y="676" width="26" height="58" rx="4"/>
      <rect x="248" y="676" width="26" height="58" rx="4"/>
      <rect x="280" y="676" width="26" height="58" rx="4"/>
      <rect x="312" y="676" width="26" height="58" rx="4"/>
      <rect x="344" y="676" width="26" height="58" rx="4"/>
      <rect x="376" y="676" width="26" height="58" rx="4"/>
      <rect x="408" y="676" width="26" height="58" rx="4"/>
      <rect x="440" y="676" width="26" height="58" rx="4"/>
      <rect x="472" y="676" width="26" height="58" rx="4"/>
      <rect x="504" y="676" width="26" height="58" rx="4"/>
      <rect x="536" y="676" width="26" height="58" rx="4"/>
    </g>
    <g fill="#111116">
      <rect x="240" y="676" width="14" height="36" rx="3"/>
      <rect x="272" y="676" width="14" height="36" rx="3"/>
      <rect x="336" y="676" width="14" height="36" rx="3"/>
      <rect x="368" y="676" width="14" height="36" rx="3"/>
      <rect x="400" y="676" width="14" height="36" rx="3"/>
      <rect x="464" y="676" width="14" height="36" rx="3"/>
      <rect x="496" y="676" width="14" height="36" rx="3"/>
      <rect x="528" y="676" width="14" height="36" rx="3"/>
    </g>
  </g>

  <!-- microphone -->
  <g>
    <rect x="640" y="700" width="10" height="120" rx="5" fill="#2b2b34"/>
    <rect x="600" y="812" width="90" height="12" rx="6" fill="#2b2b34"/>
    <rect x="620" y="660" width="52" height="52" rx="26" fill="#1c1c24" stroke="#3a3a44"/>
    <circle cx="646" cy="686" r="12" fill="#a3e635" opacity="0.5"/>
  </g>

  <!-- headphones -->
  <g stroke="#a3e635" stroke-width="10" fill="none" opacity="0.85">
    <path d="M80 250 a60 60 0 0 1 120 0"/>
  </g>
  <g fill="#1c1c24" stroke="#33333c">
    <rect x="66" y="244" width="30" height="52" rx="12"/>
    <rect x="184" y="244" width="30" height="52" rx="12"/>
  </g>

  <text x="400" y="880" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="30" font-weight="700" fill="#fafafa">STUDIO A</text>
  <text x="400" y="916" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="20" fill="#8b8b96">Accra, Ghana · mixed on Adam A7X</text>
</svg>
